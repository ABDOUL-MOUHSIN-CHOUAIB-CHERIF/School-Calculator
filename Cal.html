<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculator</title>
    <link rel="stylesheet" href="Cal.css">
</head>
<body>
    <div id="calculator">
        <input type="text" id="display" readonly>
        <div id="calculator-container">
            <div id="basic-section">
                <div id="keys">
                    <button onclick="appendToDisplay('+')" class="operator-btn">+</button>
                    <button onclick="appendToDisplay('1')">1</button>
                    <button onclick="appendToDisplay('2')">2</button>
                    <button onclick="appendToDisplay('3')">3</button>
                    <button onclick="appendToDisplay('-')" class="operator-btn">-</button>
                    <button onclick="appendToDisplay('4')">4</button>
                    <button onclick="appendToDisplay('5')">5</button>
                    <button onclick="appendToDisplay('6')">6</button>
                    <button onclick="appendToDisplay('*')" class="operator-btn">*</button>
                    <button onclick="appendToDisplay('7')">7</button>
                    <button onclick="appendToDisplay('8')">8</button>
                    <button onclick="appendToDisplay('9')">9</button>
                    <button onclick="appendToDisplay('/')" class="operator-btn">/</button>
                    <button onclick="appendToDisplay('0')">0</button>
                    <button onclick="appendToDisplay('.')">.</button>
                    <button onclick="calculate()">=</button>
                    <button onclick="clearPrevious()" class="operator-btn">⌫</button>
                    <button onclick="clearDisplay()" class="operator-btn">AC</button>
                    <button id="science" onclick="toggleScientific()" class="operator-btn">SCN</button>
                </div>
            </div>
            <div id="scientific-section" style="display: none;">
                <div id="scientific-buttons">
                    <button onclick="appendToDisplay('sin(')">sin</button>
                    <button onclick="appendToDisplay('cos(')">cos</button>
                    <button onclick="appendToDisplay('tan(')">tan</button>
                    <button onclick="appendToDisplay('log(')">log</button>
                    <button onclick="appendToDisplay('%')">%</button>
                    <button onclick="appendToDisplay('(')">(</button>
                    <button onclick="appendToDisplay(')')">)</button>
                    <button onclick="appendToDisplay('Math.PI')">π</button>
                    <button onclick="appendToDisplay('Math.E')">e</button>
                    <button onclick="appendToDisplay('**2')">x²</button>
                    <button onclick="appendToDisplay('**0.5')">√</button>
                </div>
            </div>
        </div>
    </div>
    <script src="calc.js"></script>
</body>
</html>
